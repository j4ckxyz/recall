[package]
name = "recall"
version = "0.1.0"
edition = "2024"
description = "Self-hosted, agent-agnostic personal memory over MCP"
license = "MIT"
repository = "https://github.com/j4ckxyz/recall"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
sha2 = "0.10"
getrandom = "0.3"
unicode-normalization = "0.1"

[features]
default = ["model"]
# Compile the int8 embedding model (models/recall.rv) into the binary.
model = []
# Linux (incl. Raspberry Pi): build OpenSSL for SQLCipher instead of linking the system one.
vendored-openssl = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = [".", "bench"]

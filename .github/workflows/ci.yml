name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, features: "" }
          - { os: ubuntu-24.04, features: "--features vendored-openssl" }
          # Same architecture as 64-bit Raspberry Pi OS.
          - { os: ubuntu-24.04-arm, features: "--features vendored-openssl" }
          - { os: windows-latest, features: "--features vendored-openssl" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p recall --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test -p recall ${{ matrix.features }}

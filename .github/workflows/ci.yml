name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, features: "" }
          - { os: ubuntu-24.04, features: "--features vendored-openssl" }
          # Same architecture as 64-bit Raspberry Pi OS.
          - { os: ubuntu-24.04-arm, features: "--features vendored-openssl" }
          - { os: windows-latest, features: "--features vendored-openssl" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p recall --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test -p recall ${{ matrix.features }}

  web-css:
    # web/app.css is committed (no Node at build time); make sure it matches
    # the Tailwind classes actually used in web/index.html and web/app.js.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x tailwindcss
          TAILWIND=$PWD/tailwindcss ./web/build.sh
          git diff --exit-code web/app.css || (echo "web/app.css is stale: run ./web/build.sh" && exit 1)
      - run: node --check web/app.js
